<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Clipes</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
  h1 { text-align: center; }
  #status { text-align: center; color: #64748b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
  .card { background: #f8fafc; border-radius: 10px; padding: 10px; }
  .card video { width: 100%; border-radius: 8px; background: #000; }
  .card .meta { font-size: 13px; color: #64748b; margin-top: 6px; display: flex; justify-content: space-between; }
  a.back { display: inline-block; margin-bottom: 10px; color: #2563eb; text-decoration: none; }
</style>
</head>
<body>
  <a class="back" href="/">← Voltar</a>
  <h1>Clipes salvos</h1>
  <p id="status">Carregando...</p>
  <div class="grid" id="grid"></div>

<script>
function clipPoster(url) {
  return url
    .replace('/video/upload/', '/video/upload/so_0,w_640,q_auto,f_jpg/')
    .replace(/\.[a-z0-9]+(?=($|\?))/i, '.jpg');
}

function optimizedClipUrl(url) {
  return url.replace('/video/upload/', '/video/upload/q_auto/f_auto/');
}

async function loadClips() {
  const statusEl = document.getElementById('status');
  const grid = document.getElementById('grid');
  try {
    const res = await fetch('/api/clips');
    const data = await res.json();
    const clips = data.clips || [];

    if (clips.length === 0) {
      statusEl.textContent = 'Nenhum clipe salvo ainda.';
      return;
    }

    statusEl.textContent = '';
    grid.innerHTML = clips.map((c) => `
      <div class="card">
        <video controls preload="none" poster="${clipPoster(c.url)}" src="${optimizedClipUrl(c.url)}"></video>
        <div class="meta">
          <span>Sala: ${c.code || '—'}</span>
          <span>${new Date(c.createdAt).toLocaleString('pt-BR')}</span>
        </div>
      </div>
    `).join('');
  } catch (err) {
    statusEl.textContent = 'Erro ao carregar os clipes.';
  }
}

loadClips();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>MVP - Transmissão de tela</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 60px auto; padding: 0 16px; text-align: center; }
  a.btn {
    display: inline-block; padding: 16px 28px; margin: 6px; border-radius: 8px;
    background: #2563eb; color: white; text-decoration: none; font-size: 18px;
  }
  a.btn.secondary { background: #16a34a; }

  .clips-section { margin-top: 56px; text-align: left; }
  .clips-section h2 { text-align: center; font-size: 20px; color: #334155; }
  #clipsStatus { text-align: center; color: #64748b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; margin-top: 16px; }
  .card { background: #f8fafc; border-radius: 10px; padding: 10px; }
  .card video { width: 100%; border-radius: 8px; background: #000; }
  .card .meta { font-size: 13px; color: #64748b; margin-top: 6px; display: flex; justify-content: space-between; }
  .see-all { display: block; text-align: center; margin-top: 18px; color: #7c3aed; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <h1>Transmissão de tela</h1>
  <p>Escolha uma opção:</p>
  <a class="btn" href="/broadcast.html">Iniciar transmissão</a>
  <a class="btn secondary" href="/watch.html">Assistir com um código</a>

  <div class="clips-section">
    <h2>Clipes recentes</h2>
    <p id="clipsStatus">Carregando...</p>
    <div class="grid" id="clipsGrid"></div>
    <a class="see-all" href="/clips.html">Ver todos os clipes →</a>
  </div>

<script>
const MAX_ON_HOME = 6; // quantos clipes mostrar na página inicial

async function loadRecentClips() {
  const statusEl = document.getElementById('clipsStatus');
  const grid = document.getElementById('clipsGrid');
  try {
    const res = await fetch('/api/clips');
    const data = await res.json();
    const clips = (data.clips || []).slice(0, MAX_ON_HOME);

    if (clips.length === 0) {
      statusEl.textContent = 'Nenhum clipe salvo ainda. Assista uma transmissão e clipe um momento!';
      return;
    }

    statusEl.textContent = '';
    grid.innerHTML = clips.map((c) => `
      <div class="card">
        <video controls preload="metadata" src="${c.url}"></video>
        <div class="meta">
          <span>Sala: ${c.code || '—'}</span>
          <span>${new Date(c.createdAt).toLocaleString('pt-BR')}</span>
        </div>
      </div>
    `).join('');
  } catch (err) {
    statusEl.textContent = 'Erro ao carregar os clipes.';
  }
}

loadRecentClips();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Assistir</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; text-align: center; }
  input {
    padding: 12px; font-size: 20px; text-align: center; text-transform: uppercase;
    letter-spacing: 4px; width: 140px; border: 2px solid #cbd5e1; border-radius: 8px;
  }
  button {
    padding: 12px 20px; font-size: 18px; border: none; border-radius: 8px;
    background: #16a34a; color: white; cursor: pointer; margin-left: 8px;
  }
  button:disabled { background: #86efac; cursor: default; }
  video { width: 100%; margin-top: 20px; border-radius: 8px; background: #000; }
  #errorMsg { color: #dc2626; margin-top: 10px; }
  #clipBar { margin-top: 14px; display: none; }
  #clipBar button { background: #7c3aed; font-size: 15px; padding: 10px 16px; }
  #clipBar button:disabled { background: #c4b5fd; }
  #clipStatus { margin-top: 8px; font-size: 14px; color: #475569; min-height: 20px; }
  #clipStatus a { color: #7c3aed; font-weight: 600; }
</style>
</head>
<body>
  <h1>Assistir transmissão</h1>
  <div id="joinBox">
    <input id="codeInput" placeholder="Código" maxlength="4">
    <button id="joinBtn">Entrar</button>
    <p id="errorMsg"></p>
  </div>

  <video id="remoteVideo" autoplay playsinline controls style="display:none"></video>

  <div id="clipBar">
    <button id="clip30Btn">🎬 Clipar últimos 30s</button>
    <button id="clip60Btn">🎬 Clipar últimos 60s</button>
    <div id="clipStatus"></div>
  </div>

  <p><a href="/clips.html">Ver todos os clipes salvos →</a></p>

<script>
const joinBtn = document.getElementById('joinBtn');
const codeInput = document.getElementById('codeInput');
const errorMsg = document.getElementById('errorMsg');
const remoteVideo = document.getElementById('remoteVideo');
const joinBox = document.getElementById('joinBox');
const clipBar = document.getElementById('clipBar');
const clip30Btn = document.getElementById('clip30Btn');
const clip60Btn = document.getElementById('clip60Btn');
const clipStatus = document.getElementById('clipStatus');

const iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
let ws, pc;
let joinedRoom = false;
let pendingClipRequestId = null;
let pendingClipTimeout;

codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });

function sendSignal(message) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    errorMsg.textContent = 'A conexão com o servidor foi interrompida.';
    return false;
  }
  ws.send(JSON.stringify(message));
  return true;
}

joinBtn.addEventListener('click', () => {
  if (joinBtn.disabled) return;
  const code = codeInput.value.trim().toUpperCase();
  if (!code) return;
  errorMsg.textContent = '';
  joinBtn.disabled = true;
  joinBtn.textContent = 'Conectando...';

  const socket = new WebSocket(location.origin.replace(/^http/, 'ws'));
  ws = socket;

  socket.onopen = () => {
    if (ws !== socket) return socket.close();
    socket.send(JSON.stringify({ type: 'join-room', code }));
  };

  socket.onmessage = async (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'error') {
      errorMsg.textContent = msg.message;
      socket.close();
    } else if (msg.type === 'joined') {
      joinedRoom = true;
      joinBox.style.display = 'none';
      remoteVideo.style.display = 'block';
      setupPeerConnection();
    } else if (msg.type === 'offer') {
      await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      sendSignal({ type: 'answer', sdp: answer });
    } else if (msg.type === 'ice-candidate') {
      if (msg.candidate) {
        try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch (e) {}
      }
    } else if (msg.type === 'broadcast-ended') {
      alert('A transmissão foi encerrada.');
      location.reload();
    } else if (msg.type === 'clip-accepted') {
      pendingClipRequestId = msg.requestId;
      clipStatus.textContent = 'Preparando e processando clipe...';
    } else if (msg.type === 'clip-result') {
      if (pendingClipRequestId && msg.requestId !== pendingClipRequestId) return;
      clipStatus.innerHTML = `Clipe salvo! <a href="${msg.url}" target="_blank" rel="noopener">Assistir</a> · <a href="/clips.html">Ver galeria</a>`;
      finishClipRequest();
    } else if (msg.type === 'clip-error') {
      if (pendingClipRequestId && msg.requestId && msg.requestId !== pendingClipRequestId) return;
      clipStatus.textContent = 'Erro: ' + msg.message;
      finishClipRequest();
    }
  };

  socket.onerror = () => {
    if (ws === socket && !joinedRoom) {
      errorMsg.textContent = 'Não foi possível conectar ao servidor.';
    }
  };

  socket.onclose = () => {
    if (ws !== socket) return;
    ws = null;
    if (!joinedRoom) {
      joinBtn.disabled = false;
      joinBtn.textContent = 'Entrar';
    }
  };
});

function setupPeerConnection() {
  pc = new RTCPeerConnection({ iceServers });

  pc.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
    remoteVideo.onloadedmetadata = () => {
      clipBar.style.display = 'block';
    };
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      sendSignal({ type: 'ice-candidate', candidate: event.candidate });
    }
  };
}

function makeClip(seconds) {
  if (pendingClipTimeout) return;
  clip30Btn.disabled = true;
  clip60Btn.disabled = true;
  clipStatus.textContent = 'Solicitando clipe...';

  if (!sendSignal({ type: 'clip-request', duration: seconds })) {
    finishClipRequest();
    return;
  }

  pendingClipTimeout = setTimeout(() => {
    clipStatus.textContent = 'O processamento demorou mais de 4 minutos e foi cancelado.';
    finishClipRequest();
  }, 240_000);
}

function finishClipRequest() {
  clearTimeout(pendingClipTimeout);
  pendingClipTimeout = null;
  pendingClipRequestId = null;
  clip30Btn.disabled = false;
  clip60Btn.disabled = false;
}

clip30Btn.addEventListener('click', () => makeClip(30));
clip60Btn.addEventListener('click', () => makeClip(60));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Assistir</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; text-align: center; }
  input {
    padding: 12px; font-size: 20px; text-align: center; text-transform: uppercase;
    letter-spacing: 4px; width: 140px; border: 2px solid #cbd5e1; border-radius: 8px;
  }
  button {
    padding: 12px 20px; font-size: 18px; border: none; border-radius: 8px;
    background: #16a34a; color: white; cursor: pointer; margin-left: 8px;
  }
  button:disabled { background: #86efac; cursor: default; }
  video { width: 100%; margin-top: 20px; border-radius: 8px; background: #000; }
  #errorMsg { color: #dc2626; margin-top: 10px; }
  #clipBar { margin-top: 14px; display: none; }
  #clipBar button { background: #7c3aed; font-size: 15px; padding: 10px 16px; }
  #clipBar button:disabled { background: #c4b5fd; }
  #clipStatus { margin-top: 8px; font-size: 14px; color: #475569; min-height: 20px; }
  #clipStatus a { color: #7c3aed; font-weight: 600; }
</style>
</head>
<body>
  <h1>Assistir transmissão</h1>
  <div id="joinBox">
    <input id="codeInput" placeholder="Código" maxlength="4">
    <button id="joinBtn">Entrar</button>
    <p id="errorMsg"></p>
  </div>

  <video id="remoteVideo" autoplay playsinline controls style="display:none"></video>

  <div id="clipBar">
    <button id="clip30Btn">🎬 Clipar últimos 30s</button>
    <button id="clip60Btn">🎬 Clipar últimos 60s</button>
    <div id="clipStatus"></div>
  </div>

  <p><a href="/clips.html">Ver todos os clipes salvos →</a></p>

<script src="/clip-buffer.js"></script>
<script>
const joinBtn = document.getElementById('joinBtn');
const codeInput = document.getElementById('codeInput');
const errorMsg = document.getElementById('errorMsg');
const remoteVideo = document.getElementById('remoteVideo');
const joinBox = document.getElementById('joinBox');
const clipBar = document.getElementById('clipBar');
const clip30Btn = document.getElementById('clip30Btn');
const clip60Btn = document.getElementById('clip60Btn');
const clipStatus = document.getElementById('clipStatus');

const iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
let ws, pc;
let currentCode = '';
let joinedRoom = false;

// --- Buffer contínuo para os clipes ---
const SEGMENT_MS = 5000;
const MAX_BUFFER_MS = 75_000;
let recordingStream;
let recorder;
let segmentBuffer = []; // cada item é um WebM completo e reproduzível
let currentSegmentDone = Promise.resolve();

codeInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') joinBtn.click(); });

function sendSignal(message) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    errorMsg.textContent = 'A conexão com o servidor foi interrompida.';
    return false;
  }
  ws.send(JSON.stringify(message));
  return true;
}

joinBtn.addEventListener('click', () => {
  if (joinBtn.disabled) return;
  const code = codeInput.value.trim().toUpperCase();
  if (!code) return;
  currentCode = code;
  errorMsg.textContent = '';
  joinBtn.disabled = true;
  joinBtn.textContent = 'Conectando...';

  const socket = new WebSocket(location.origin.replace(/^http/, 'ws'));
  ws = socket;

  socket.onopen = () => {
    if (ws !== socket) return socket.close();
    socket.send(JSON.stringify({ type: 'join-room', code }));
  };

  socket.onmessage = async (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'error') {
      errorMsg.textContent = msg.message;
      socket.close();
    } else if (msg.type === 'joined') {
      joinedRoom = true;
      joinBox.style.display = 'none';
      remoteVideo.style.display = 'block';
      setupPeerConnection();
    } else if (msg.type === 'offer') {
      await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      sendSignal({ type: 'answer', sdp: answer });
    } else if (msg.type === 'ice-candidate') {
      if (msg.candidate) {
        try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch (e) {}
      }
    } else if (msg.type === 'broadcast-ended') {
      alert('A transmissão foi encerrada.');
      location.reload();
    }
  };

  socket.onerror = () => {
    if (ws === socket && !joinedRoom) {
      errorMsg.textContent = 'Não foi possível conectar ao servidor.';
    }
  };

  socket.onclose = () => {
    if (ws !== socket) return;
    ws = null;
    if (!joinedRoom) {
      joinBtn.disabled = false;
      joinBtn.textContent = 'Entrar';
    }
  };
});

function setupPeerConnection() {
  pc = new RTCPeerConnection({ iceServers });

  pc.ontrack = (event) => {
    remoteVideo.srcObject = event.streams[0];
    remoteVideo.onloadedmetadata = () => {
      // Espera um instante pra dar tempo da faixa de áudio chegar também
      setTimeout(() => startRecordingBuffer(event.streams[0]), 800);
    };
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      sendSignal({ type: 'ice-candidate', candidate: event.candidate });
    }
  };
}

function startRecordingBuffer(stream) {
  if (recordingStream) return;
  recordingStream = stream;
  startRecordingSegment();
  clipBar.style.display = 'block';
}

function hasLiveVideoTrack() {
  return recordingStream && recordingStream.getVideoTracks().some((track) => track.readyState === 'live');
}

function pruneSegmentBuffer() {
  let bufferedDuration = segmentBuffer.reduce((total, segment) => total + segment.durationMs, 0);
  while (segmentBuffer.length > 1 && bufferedDuration - segmentBuffer[0].durationMs >= MAX_BUFFER_MS) {
    bufferedDuration -= segmentBuffer[0].durationMs;
    segmentBuffer.shift();
  }
}

function startRecordingSegment() {
  if (!hasLiveVideoTrack()) return;

  const chunks = [];
  const startedAt = performance.now();
  const supportedType = [
    'video/webm;codecs=vp8,opus',
    'video/webm;codecs=vp8',
    'video/webm',
  ].find((type) => MediaRecorder.isTypeSupported(type));
  let segmentRecorder;

  try {
    segmentRecorder = new MediaRecorder(
      recordingStream,
      supportedType ? { mimeType: supportedType } : undefined
    );
  } catch (e) {
    console.warn('Gravação de clipes não suportada neste navegador:', e);
    recorder = null;
    clipStatus.textContent = 'Este navegador não conseguiu iniciar a gravação dos clipes.';
    return;
  }

  let resolveSegment;
  const segmentDone = new Promise((resolve) => { resolveSegment = resolve; });
  recorder = segmentRecorder;
  currentSegmentDone = segmentDone;

  segmentRecorder.ondataavailable = (event) => {
    if (event.data && event.data.size > 0) chunks.push(event.data);
  };

  segmentRecorder.onstop = () => {
    const durationMs = Math.max(1, performance.now() - startedAt);
    if (chunks.length > 0) {
      segmentBuffer.push({
        blob: new Blob(chunks, { type: segmentRecorder.mimeType || 'video/webm' }),
        durationMs,
      });
      pruneSegmentBuffer();
    }

    if (recorder === segmentRecorder) recorder = null;
    resolveSegment();
    if (hasLiveVideoTrack()) startRecordingSegment();
  };

  segmentRecorder.start();
  setTimeout(() => {
    if (segmentRecorder.state === 'recording') segmentRecorder.stop();
  }, SEGMENT_MS);
}

async function finalizeCurrentSegment() {
  if (!recorder) return;
  const segmentRecorder = recorder;
  const segmentDone = currentSegmentDone;
  if (segmentRecorder.state === 'recording') segmentRecorder.stop();
  await segmentDone;
}

async function makeClip(seconds) {
  if (!recorder && segmentBuffer.length === 0) {
    clipStatus.textContent = 'Ainda não há vídeo suficiente gravado. Espere alguns segundos.';
    return;
  }

  clip30Btn.disabled = true;
  clip60Btn.disabled = true;
  const controller = new AbortController();
  const requestTimeout = setTimeout(() => controller.abort(), 240_000);

  try {
    clipStatus.textContent = 'Preparando clipe...';

    // Finaliza o segmento atual para que cada arquivo enviado tenha seu próprio
    // cabeçalho, timestamps iniciando em zero e um primeiro quadro decodificável.
    await finalizeCurrentSegment();
    const selection = selectClipSegments(segmentBuffer, seconds * 1000);
    if (selection.segments.length === 0) throw new Error('Nenhum segmento de vídeo disponível.');

    const formData = new FormData();
    selection.segments.forEach((segment, index) => {
      formData.append('videos', segment.blob, `segmento-${index}.webm`);
    });
    formData.append('code', currentCode);
    formData.append('duration', String(seconds));
    formData.append('startOffsetMs', String(Math.round(selection.startOffsetMs)));

    clipStatus.textContent = 'Enviando e processando clipe...';
    const res = await fetch('/api/clips', { method: 'POST', body: formData, signal: controller.signal });
    const responseText = await res.text();
    let data = {};
    try { data = JSON.parse(responseText); } catch (e) {}

    if (!res.ok) {
      const fallback = res.status === 502
        ? 'O servidor reiniciou durante o processamento. Aguarde alguns segundos e tente novamente.'
        : `não foi possível salvar o clipe (HTTP ${res.status}).`;
      clipStatus.textContent = 'Erro: ' + (data.error || fallback);
    } else {
      clipStatus.innerHTML = `Clipe salvo! <a href="${data.url}" target="_blank">Assistir</a> · <a href="/clips.html">Ver galeria</a>`;
    }
  } catch (err) {
    clipStatus.textContent = err.name === 'AbortError'
      ? 'O processamento demorou mais de 4 minutos e foi cancelado.'
      : 'Erro de conexão ao enviar o clipe.';
  } finally {
    clearTimeout(requestTimeout);
    clip30Btn.disabled = false;
    clip60Btn.disabled = false;
  }
}

clip30Btn.addEventListener('click', () => makeClip(30));
clip60Btn.addEventListener('click', () => makeClip(60));
</script>
</body>
</html>
